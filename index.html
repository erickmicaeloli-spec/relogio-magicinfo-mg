<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data e hora</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; }
  body {
    background: #111827;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
  }
  .box { padding: 10px 18px; width: 100%; }
  #dia { font-size: clamp(16px, 5vw, 34px); font-weight: 600; margin-bottom: 8px; }
  #data { font-size: clamp(18px, 6vw, 42px); margin-bottom: 8px; }
  #hora { font-size: clamp(28px, 10vw, 68px); font-weight: 700; letter-spacing: 1px; }
</style>
</head>
<body>
  <main class="box">
    <div id="dia">Carregando...</div>
    <div id="data"></div>
    <div id="hora"></div>
  </main>
<script>
function atualizarRelogio() {
  const agora = new Date();
  const opcoesDia = { weekday: 'long' };
  const opcoesData = { day: '2-digit', month: '2-digit', year: 'numeric' };
  document.getElementById('dia').textContent =
    new Intl.DateTimeFormat('pt-BR', opcoesDia).format(agora);
  document.getElementById('data').textContent =
    new Intl.DateTimeFormat('pt-BR', opcoesData).format(agora);
  document.getElementById('hora').textContent =
    new Intl.DateTimeFormat('pt-BR', {
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: false
    }).format(agora);
}
atualizarRelogio();
setInterval(atualizarRelogio, 1000);
</script>
</body>
</html>
